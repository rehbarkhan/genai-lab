services:
  db:
    image: pgvector/pgvector:pg16        # Postgres 16 with the vector extension preinstalled
    environment:
      POSTGRES_DB: genai
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata: